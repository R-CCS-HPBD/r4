[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video-feed"
version = "0.1.0"
description = "Generalized video ingest → UMRS workflow → results/vector plane (client stdlib helper + worker adapter)"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
yaml = ["PyYAML>=6.0"]
pg = ["psycopg2-binary>=2.9", "pgvector>=0.5.0"]
test = ["pytest>=7.0", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
include = ["video_feed*"]
