# =============================================================================
# R4 Platform - Demo Stack (Compose)
# =============================================================================
# Complete platform stack for local development and testing.
# Mirrors HPC deployment for consistency.
# =============================================================================

name: r4-demo

services:
  # ===========================================================================
  # Infrastructure Services
  # ===========================================================================

  postgres:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: r4
      POSTGRES_PASSWORD: r4-dev
      POSTGRES_DB: r4
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U r4"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - r4-internal

  minio:
    image: docker.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - r4-internal

  # ===========================================================================
  # Platform Services
  # ===========================================================================

  umrs:
    image: r4-umrs:latest
    build:
      context: ../../../../
      dockerfile: umrs/docker/Dockerfile
    environment:
      DATABASE_URL: postgresql://r4:r4-dev@postgres:5432/r4
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: r4-data
      EXECUTION_BACKEND: compose
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - r4-internal

  # ===========================================================================
  # Gateway (NGINX + Sidecar)
  # ===========================================================================

  gateway-nginx:
    build:
      context: ../../../../gateway/nginx
      dockerfile: Dockerfile
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    environment:
      LITELLM_HOST: litellm
      LITELLM_PORT: "11434"
      UMRS_HOST: umrs
      UMRS_PORT: "8000"
    depends_on:
      gateway-sidecar:
        condition: service_healthy
      umrs:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - r4-internal
      - r4-external

  gateway-sidecar:
    build:
      context: ../../../../gateway/sidecar
      dockerfile: Dockerfile
    environment:
      UMRS_URL: http://umrs:8000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: r4-data
      DATABASE_URL: postgresql://r4:r4-dev@postgres:5432/r4
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - r4-internal

  # ===========================================================================
  # GPU Services (Mini-RiVault)
  # ===========================================================================

  vllm:
    image: docker.io/vllm/vllm-openai:v0.20.0
    profiles:
      - gpu
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_OFFLINE: "1"
    volumes:
      - ${MODEL_PATH:-./models}:/models:ro
    command: >
      --model /models
      --served-model-name rivault-model
      --host 0.0.0.0
      --port 8000
      --max-model-len ${VLLM_MAX_MODEL_LEN:-4096}
      --enable-auto-tool-choice
      --tool-call-parser hermes
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    networks:
      - r4-internal

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles:
      - gpu
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-demo-key}
    volumes:
      - ./litellm-config.yml:/app/config.yaml:ro
    command: --config /app/config.yaml
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/health/liveliness"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - r4-internal

  # ===========================================================================
  # Client Environment (Interactive)
  # ===========================================================================

  client:
    build:
      context: ../../../../
      dockerfile: demos/tiers/environments/client/Containerfile
    profiles:
      - interactive
    environment:
      GATEWAY_URL: http://gateway-nginx:8080
    depends_on:
      gateway-nginx:
        condition: service_healthy
    stdin_open: true
    tty: true
    networks:
      - r4-external

volumes:
  postgres-data:
  minio-data:

networks:
  r4-internal:
    internal: true
  r4-external:
    name: r4-network
