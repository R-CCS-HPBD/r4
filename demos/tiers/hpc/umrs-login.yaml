# UMRS Login Node Services (Podman Compose)
# ==========================================
# Services that run on the login node (no GPU required).
# These provide the UMRS API, object storage, and vector database.
#
# Usage:
#   podman compose -f umrs-login.yaml up -d
#
# Requires:
#   - Podman with podman-compose
#   - Network access from compute nodes

services:
  postgres:
    image: docker.io/ankane/pgvector:latest
    networks:
      umrs-net:
        ipv4_address: ${UMRS_PRIV_IP1TO3:-10.0.5}.10
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-umrs}
      TZ: ${GENAI_TZ:-Asia/Tokyo}
      PGTZ: ${GENAI_TZ:-Asia/Tokyo}
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init_pgvector.sql:/docker-entrypoint-initdb.d/init_pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    cap_drop: [ALL]
    cap_add: [sys_nice, setuid, setgid, chown]
    restart: unless-stopped

  minio:
    image: docker.io/minio/minio:latest
    networks:
      umrs-net:
        ipv4_address: ${UMRS_PRIV_IP1TO3:-10.0.5}.11
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      TZ: ${GENAI_TZ:-Asia/Tokyo}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5
    cap_drop: [ALL]
    cap_add: [sys_nice, chown, dac_override, setgid, setuid]
    restart: unless-stopped

  umrs-server:
    image: ${UMRS_IMAGE:-ghcr.io/riken-rccs/umrs:latest}
    build:
      context: ../../umrs
      dockerfile: docker/Dockerfile
    networks:
      umrs-net:
        ipv4_address: ${UMRS_PRIV_IP1TO3:-10.0.5}.12
    ports:
      - "${UMRS_API_PORT:-8000}:8000"
      - "${UMRS_ZMQ_PORT:-5555}:5555"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: "1"
      # Database
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-umrs}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # S3/MinIO
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-umrs-data}
      # Model cache (shared with compute nodes via NFS)
      SENTENCE_TRANSFORMERS_HOME: /shared/models/sentence_transformers
      HF_HOME: /shared/models/hf
      # UMRS now discovers active LiteLLM endpoints via orchestration and the
      # endpoint registry; no direct LiteLLM base URL is configured here.
      TZ: ${GENAI_TZ:-Asia/Tokyo}
    volumes:
      - ${SHARED_MODEL_PATH:-./models}:/shared/models
      - ./conf_umrs.json:/root/conf_umrs.json:ro
      - ./user_files:/root/user_files:ro
      - ./s3cfg:/root/s3cfg:ro
    command: ["python", "src/server_umrs.py", "-c", "/root/conf_umrs.json"]
    cap_drop: [ALL]
    cap_add: [sys_nice]
    restart: unless-stopped

volumes:
  pg_data:
    name: umrs_pg_data
  minio_data:
    name: umrs_minio_data

networks:
  umrs-net:
    name: umrs-net
    driver: bridge
    ipam:
      config:
        - subnet: ${UMRS_PRIV_IP1TO3:-10.0.5}.0/24
