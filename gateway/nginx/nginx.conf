# =============================================================================
# R4 Platform Gateway - NGINX Configuration
# =============================================================================
# High-performance reverse proxy optimized for:
# - Heavy data traffic (video streams, batch image uploads)
# - LLM inference requests with SSE streaming
# - RAG document ingestion
# - File serving via X-Accel-Redirect
# =============================================================================

worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 16384;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with request timing
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    # Do not retain presigned URL signatures or security tokens in audit logs.
    # If a sensitive query parameter is present, redact the whole query string
    # rather than attempting partial query rewriting in NGINX config.
    map $args $audit_query {
        default $args;
        ~*(^|&)(X-Amz-Signature|X-Goog-Signature|Signature|X-Amz-Security-Token|sig)= "<redacted>";
    }

    # Structured JSON audit log for machine-parseable analysis
    log_format audit_json escape=json
        '{'
            '"timestamp":"$time_iso8601",'
            '"request_id":"$request_id",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"path":"$uri",'
            '"query":"$audit_query",'
            '"status":$status,'
            '"body_bytes_sent":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_response_time":"$upstream_response_time",'
            '"user_agent":"$http_user_agent",'
            '"user_id":"$upstream_http_x_user_id",'
            '"project_id":"$upstream_http_x_project_id",'
            '"referer":"$http_referer"'
        '}';

    access_log /var/log/nginx/access.log main;
    access_log /var/log/nginx/audit.json.log audit_json;

    # =================================================================
    # Performance Tuning for Large Files
    # =================================================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;

    # Buffer settings for mixed workloads
    client_body_buffer_size 128k;
    client_max_body_size 0;  # Unlimited by default, controlled per-location

    # Proxy buffer settings
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;

    # Temp file settings for large uploads
    proxy_temp_path /var/cache/nginx/proxy_temp 1 2;
    proxy_max_temp_file_size 10240m;

    # Micro-cache of the public service-model badge only (ADR-106 amendment
    # 2026-11-07): UMRS sees at most one badge request per 30 s per gateway
    # whatever the request rate. One fixed key, one tiny entry; no other
    # location sets proxy_cache to this zone.
    proxy_cache_path /var/cache/nginx/status_badge levels=1 keys_zone=status_badge_cache:1m
                     max_size=1m inactive=10m use_temp_path=off;

    # Gzip compression for text responses
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml application/xml+rss text/javascript;

    # =================================================================
    # Rate Limiting Zones
    # =================================================================
    limit_req_zone $binary_remote_addr zone=llm_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;
    limit_req_zone $binary_remote_addr zone=general_limit:10m rate=50r/s;
    # /health/backend (issue #634): anonymous, and every hit costs UMRS a
    # /health (sync DB getconn + SELECT 1). Keyed on the server port, i.e.
    # one bucket per gateway: behind Apache every client is 127.0.0.1, so a
    # per-address key would be one bucket anyway, and general_limit would
    # share it with real /gw traffic (2026-10-30).
    # 2026-11-07 (service-model badge review, item 1): two buckets per
    # gateway, split by lane. Apache (the TLS edge) always adds
    # X-Forwarded-For, so every public request lands in "edge"; the
    # converge's "Platform serving" probe calls 127.0.0.1:<port> directly
    # with no X-Forwarded-For and lands in "direct". A public flood can
    # spend only the edge bucket, never the converge verdict's. A client
    # cannot reach "direct" through the edge: it cannot remove the header
    # Apache adds, and a forged one only lands it in "edge".
    map $http_x_forwarded_for $health_backend_lane {
        ""      direct;
        default edge;
    }
    limit_req_zone $server_port:$health_backend_lane zone=health_backend:1m rate=5r/s;
    # /status/models.json, the public service-model badge (ADR-106
    # amendment 2026-11-07): its own bucket per gateway, never shared with
    # /health/backend, so badge traffic cannot fail a deploy probe.
    limit_req_zone $server_port zone=status_badge_limit:1m rate=5r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;
    # A rejected request is a rate limit (429 -> @error429), not the 503
    # "backend unavailable" nginx answers by default (2026-10-21).
    limit_req_status 429;
    limit_conn_status 429;

    # =================================================================
    # Upstream Definitions
    # =================================================================
    upstream litellm {
        server ${LITELLM_HOST}:${LITELLM_PORT};
        keepalive 32;
    }

    upstream umrs {
        server ${UMRS_HOST}:${UMRS_PORT};
        keepalive 32;
    }

    upstream auth_sidecar {
        server ${SIDECAR_HOST}:${SIDECAR_PORT};
        keepalive 8;
    }

    # A2L (Artifact & Agent Layer) service
    upstream a2l {
        server ${A2L_HOST}:${A2L_PORT};
        keepalive 8;
    }

    # Include route configurations
    include /etc/nginx/conf.d/*.conf;
}
