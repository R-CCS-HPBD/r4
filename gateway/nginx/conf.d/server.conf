    # =================================================================
    # v1 Lane Publication (stability S6) — /gw/v1/<family>/* → /umrs/<family>/*
    #   Allowlist from the S2/S3 classification: endpoints / models / llm
    #   are the v1-stable lane. Unlisted and unclassified families under
    #   /gw/v1/ hit the guard and 404. Legacy /gw/<family> routes stay
    #   untouched during coexistence — S7 owns deprecation/enforcement.
    #   Buffering is off for the lane because it carries the llm SSE
    #   family; general_limit per S6 decision (legacy /gw/llm/ keeps
    #   llm_limit until S7).
    # =================================================================
    location /gw/v1/ {
        return 404;
    }

    location ~ ^/gw/v1/(endpoints|models|llm)(/.*)?$ {
        limit_req zone=general_limit burst=30 nodelay;
        limit_conn conn_limit 10;

        # Auth validation (same sidecar identity tuple as every /gw/* lane)
        auth_request /auth/validate;
        auth_request_set $auth_error $upstream_http_x_auth_error;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_project_id $upstream_http_x_project_id;
        auth_request_set $auth_verified_project_id $upstream_http_x_verified_project_id;
        auth_request_set $auth_verified_is_admin $upstream_http_x_verified_is_admin;
        auth_request_set $auth_verified_hmac $upstream_http_x_verified_hmac;
        auth_request_set $auth_verified_project_memberships $upstream_http_x_verified_project_memberships;
        auth_request_set $auth_verified_memberships_hmac $upstream_http_x_verified_memberships_hmac;

        # /gw/v1/<family>/* → /umrs/<family>/*
        rewrite ^/gw/v1/(.*)$ /umrs/$1 break;

        proxy_pass http://umrs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-Project-ID $auth_project_id;
        proxy_set_header X-Verified-Project-ID $auth_verified_project_id;
        proxy_set_header X-Verified-Is-Admin $auth_verified_is_admin;
        proxy_set_header X-Verified-HMAC $auth_verified_hmac;
        proxy_set_header X-Verified-Project-Memberships $auth_verified_project_memberships;
        proxy_set_header X-Verified-Memberships-HMAC $auth_verified_memberships_hmac;
        proxy_set_header Authorization $http_authorization;

        # Lane carries the llm SSE family — streaming honored
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # =================================================================
    # v1beta Lane Publication (stability S6) — /gw/v1beta/<family>/*
