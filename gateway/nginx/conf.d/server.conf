# =============================================================================
# Main Server Block
# =============================================================================

server {
    listen ${GATEWAY_PORT};
    server_name _;

    # =================================================================
    # Health Check
    # =================================================================
    # /health is THIS nginx's liveness only (container HEALTHCHECK, k8s
    # liveness, the converge's gateway-start wait): it never asks the
    # backend, so a restart loop cannot follow a backend outage. It is
    # NOT "the platform is serving": 2026-10-28 all four public
    # /<cluster>/health answered 200 while three umrs-server-<cluster>
    # containers sat in Created (issue #634). Probes that mean "serving"
    # use /health/backend below.
    location /health {
        default_type application/json;
        return 200 '{"status": "healthy", "service": "gateway", "timestamp": "$time_iso8601"}';
    }

    # Backend-aware probe (issue #634, 2026-10-30): 200 only when this
    # gateway's own UMRS backend answers its /health with a 2xx within the
    # 2 s timeouts of /_health/umrs; anything else (refused, timeout,
    # non-2xx) is 503. Fail-closed and anonymous like /health. The
    # backend's body (component summary, site capabilities) is not
    # relayed: the answer is the fixed JSON of the two named locations.
    # Mechanics: auth_request (access phase) runs the probe first;
    # try_files (pre-content phase) then falls through to the fixed 200,
    # because a plain `return` would answer in the rewrite phase, before
    # the probe ever ran. A failed probe surfaces as 401/403/500 and
    # error_page maps all of them to the 503. Rate-limited (zone
    # health_backend, nginx.conf; limit_req runs before auth_request, so a
    # rejected hit never reaches UMRS): a 429 keeps its JSON @error429
    # answer, because this location's error_page list replaces the
    # server-level one (2026-10-30 review).
    location = /health/backend {
        limit_req zone=health_backend burst=10 nodelay;
        auth_request /_health/umrs;
        error_page 401 403 500 502 503 504 = @health_backend_down;
        error_page 429 = @error429;
        try_files /.health-backend-no-such-file @health_backend_up;
    }

    location @health_backend_up {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status": "healthy", "service": "backend", "timestamp": "$time_iso8601"}';
    }

    location @health_backend_down {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"status": "unavailable", "service": "backend", "timestamp": "$time_iso8601"}';
    }

    location /health/ready {
        # Check upstream availability
        proxy_pass http://auth_sidecar/health;
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    location = /ready {
        auth_request /_health/auth_sidecar;
        default_type application/json;

        # Aggregate readiness: the auth sidecar is the hard gate
        # (auth_request), and its /ready-aggregate answers 503 unless UMRS
        # /readiness (required stores) answers 200. (2026-10-30: this note
        # said "if UMRS is down, we still report ready"; stale since the
        # sidecar change of 2026-10-21.)
        proxy_pass http://auth_sidecar/ready-aggregate;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location = /_health/auth_sidecar {
        internal;
        proxy_pass http://auth_sidecar/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # Internal UMRS liveness probe: the auth_request of /health/backend.
    # (Its old note said "used by sidecar aggregation"; the sidecar asks
    # UMRS /readiness directly, gateway/sidecar/main.py ready_aggregate.)
    # The caller's credentials are not forwarded to the probe.
    location = /_health/umrs {
        internal;
        proxy_pass http://umrs/health;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 2s;
    }

    # =================================================================
    # SAML SP Routes — no auth_request (these ARE the auth flow)
    # Activated when SAML_ENABLED=true on the sidecar.
    # =================================================================
    location /saml/ {
        proxy_pass http://auth_sidecar;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_pass_request_body on;
        client_max_body_size 64k;
    }

    # =================================================================
    # OIDC CLI Callback Trampoline — no auth_request (user is mid-OIDC
    # flow; the sidecar serves a JS redirect page, not protected data).
    # =================================================================
    location = /auth/cli-callback {
        proxy_pass http://auth_sidecar/auth/cli-callback;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =================================================================
    # Browser Web Login — no auth_request (this IS the login flow).
    # Serves the token form (GET) and sets the r4_jwt cookie (POST).
    # Defers to /saml/login automatically when SAML is enabled.
    # =================================================================
    location = /auth/web-login {
        limit_req zone=general_limit burst=10 nodelay;
        proxy_pass http://auth_sidecar/auth/web-login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Content-Type $content_type;
        proxy_pass_request_body on;
        client_max_body_size 16k;
    }

    # =================================================================
    # Auth validation endpoint — also forwards the Cookie header so
    # the sidecar can read the SAML session cookie.
    # =================================================================
    location = /auth/validate {
        internal;
        proxy_pass http://auth_sidecar/validate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        # ADR-097: the project the client selected (r4 sends X-Project-ID);
        # the sidecar checks it against the caller's live memberships.
        proxy_set_header X-Requested-Project-ID $http_x_project_id;
    }

    # Optional auth — always returns 200.  Sets X-User-ID when a valid
    # token is present, empty string otherwise.  Used by connect-info.
    location = /auth/validate-optional {
        internal;
        proxy_pass http://auth_sidecar/validate-optional;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Original-Method $request_method;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        # ADR-097: the project the client selected (r4 sends X-Project-ID);
        # the sidecar checks it against the caller's live memberships.
        proxy_set_header X-Requested-Project-ID $http_x_project_id;
    }

    # =================================================================
    # Error Pages
    # =================================================================
    error_page 401 = @error401;
    location @error401 {
        # Browser clients get a redirect to the login page; the sidecar
        # serves a token form (OIDC deployments) or defers to /saml/login
        # (SAML deployments).  API clients (Accept: application/json or
        # Authorization header present) get the JSON error.
        default_type application/json;
        if ($http_accept ~* "application/json") {
            return 401 '{"error": "Unauthorized", "message": "Invalid or missing API key"}';
        }
        if ($http_authorization) {
            return 401 '{"error": "Unauthorized", "message": "Invalid or missing API key"}';
        }
        return 302 /auth/web-login?redirect_to=$request_uri;
    }

    # =================================================================
    # LLM Routes - /gw/llm/* → UMRS (direct, endpoint discovery + proxy
    #   all happen inside UMRS — no Python Gateway hop)
    # =================================================================
    location /gw/llm/ {
        limit_req zone=llm_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        # Auth validation
        auth_request /auth/validate;
        auth_request_set $auth_error $upstream_http_x_auth_error;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_project_id $upstream_http_x_project_id;
        auth_request_set $auth_verified_project_id $upstream_http_x_verified_project_id;
        auth_request_set $auth_verified_is_admin $upstream_http_x_verified_is_admin;
        auth_request_set $auth_verified_hmac $upstream_http_x_verified_hmac;
        auth_request_set $auth_verified_project_memberships $upstream_http_x_verified_project_memberships;
        auth_request_set $auth_verified_memberships_hmac $upstream_http_x_verified_memberships_hmac;

        # Rewrite /gw/llm/* → /umrs/llm/* for UMRS LLM proxy router
        rewrite ^/gw/llm/(.*)$ /umrs/llm/$1 break;

        proxy_pass http://umrs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-Project-ID $auth_project_id;
        proxy_set_header X-Verified-Project-ID $auth_verified_project_id;
        proxy_set_header X-Verified-Is-Admin $auth_verified_is_admin;
        proxy_set_header X-Verified-HMAC $auth_verified_hmac;
        proxy_set_header X-Verified-Project-Memberships $auth_verified_project_memberships;
        proxy_set_header X-Verified-Memberships-HMAC $auth_verified_memberships_hmac;
        proxy_set_header Authorization $http_authorization;

        # SSE streaming for chat completions
        proxy_buffering off;
        proxy_cache off;
        # 7200s (W5/U2, 2026-10-05): a NON-streaming reasoning turn sends no
        # byte until the model finishes (measured up to 93 min); streaming
        # replies keep bytes flowing and never come near this limit. Matches
        # the UMRS proxies' total deadline (LLM_PROXY_TOTAL_TIMEOUT).
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    # =================================================================
    # Assistant API Routes - /gw/chat/* → UMRS chat proxy →
    #   Assistant Service inside mini-RiVault (ADR-012).
    #   Project-aware, tool-aware, MCP-aware conversational surface.
    # =================================================================
    location /gw/chat/ {
        limit_req zone=llm_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        # Auth validation
        auth_request /auth/validate;
        auth_request_set $auth_error $upstream_http_x_auth_error;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_project_id $upstream_http_x_project_id;
        auth_request_set $auth_verified_project_id $upstream_http_x_verified_project_id;
        auth_request_set $auth_verified_is_admin $upstream_http_x_verified_is_admin;
        auth_request_set $auth_verified_hmac $upstream_http_x_verified_hmac;
        auth_request_set $auth_verified_project_memberships $upstream_http_x_verified_project_memberships;
        auth_request_set $auth_verified_memberships_hmac $upstream_http_x_verified_memberships_hmac;

        # Rewrite /gw/chat/* → /umrs/chat/* for UMRS chat proxy router
        rewrite ^/gw/chat/(.*)$ /umrs/chat/$1 break;

        proxy_pass http://umrs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-Project-ID $auth_project_id;
        proxy_set_header X-Verified-Project-ID $auth_verified_project_id;
        proxy_set_header X-Verified-Is-Admin $auth_verified_is_admin;
        proxy_set_header X-Verified-HMAC $auth_verified_hmac;
        proxy_set_header X-Verified-Project-Memberships $auth_verified_project_memberships;
        proxy_set_header X-Verified-Memberships-HMAC $auth_verified_memberships_hmac;
        proxy_set_header Authorization $http_authorization;

        # SSE streaming for chat completions
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # =================================================================
    # Companion Routes - /gw/companion/* → UMRS (T3b m5 surface behind the
    #   auth sidecar; same verified-identity contract as other /gw/*
    #   routes. Turns use SSE — buffering disabled, streaming honored).
    # =================================================================
    location /gw/companion/ {
        limit_req zone=llm_limit burst=20 nodelay;
        limit_conn conn_limit 10;

        # Auth validation
        auth_request /auth/validate;
        auth_request_set $auth_error $upstream_http_x_auth_error;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_project_id $upstream_http_x_project_id;
        auth_request_set $auth_verified_project_id $upstream_http_x_verified_project_id;
        auth_request_set $auth_verified_is_admin $upstream_http_x_verified_is_admin;
        auth_request_set $auth_verified_hmac $upstream_http_x_verified_hmac;
        auth_request_set $auth_verified_project_memberships $upstream_http_x_verified_project_memberships;
        auth_request_set $auth_verified_memberships_hmac $upstream_http_x_verified_memberships_hmac;

        # Rewrite /gw/companion/* → /umrs/companion/* (m5 surface)
        rewrite ^/gw/companion/(.*)$ /umrs/companion/$1 break;

        proxy_pass http://umrs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-Project-ID $auth_project_id;
        proxy_set_header X-Verified-Project-ID $auth_verified_project_id;
        proxy_set_header X-Verified-Is-Admin $auth_verified_is_admin;
        proxy_set_header X-Verified-HMAC $auth_verified_hmac;
        proxy_set_header X-Verified-Project-Memberships $auth_verified_project_memberships;
        proxy_set_header X-Verified-Memberships-HMAC $auth_verified_memberships_hmac;
        proxy_set_header Authorization $http_authorization;

        # SSE streaming for turn-event replay (necessary over proxy)
        proxy_buffering off;
        proxy_cache off;
        # 7200s (W5/U2, 2026-10-05): a NON-streaming reasoning turn sends no
        # byte until the model finishes (measured up to 93 min); streaming
        # replies keep bytes flowing and never come near this limit. Matches
        # the UMRS proxies' total deadline (LLM_PROXY_TOTAL_TIMEOUT).
        proxy_read_timeout 7200s;
        proxy_send_timeout 7200s;
    }

    # =================================================================
    # RAG Routes - /gw/rag/* → UMRS (direct, discovers mini-RiVault
    #   endpoint from registry and proxies to RAG service)
    # =================================================================
    location /gw/rag/ {
        limit_req zone=upload_limit burst=10 nodelay;

        # Auth validation
        auth_request /auth/validate;
        auth_request_set $auth_error $upstream_http_x_auth_error;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_project_id $upstream_http_x_project_id;
        auth_request_set $auth_verified_project_id $upstream_http_x_verified_project_id;
        auth_request_set $auth_verified_is_admin $upstream_http_x_verified_is_admin;
        auth_request_set $auth_verified_hmac $upstream_http_x_verified_hmac;
        auth_request_set $auth_verified_project_memberships $upstream_http_x_verified_project_memberships;
        auth_request_set $auth_verified_memberships_hmac $upstream_http_x_verified_memberships_hmac;

        # Rewrite /gw/rag/* → /umrs/rag/* for UMRS RAG proxy router
        rewrite ^/gw/rag/(.*)$ /umrs/rag/$1 break;

        proxy_pass http://umrs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-Project-ID $auth_project_id;
        proxy_set_header X-Verified-Project-ID $auth_verified_project_id;
        proxy_set_header X-Verified-Is-Admin $auth_verified_is_admin;
        proxy_set_header X-Verified-HMAC $auth_verified_hmac;
        proxy_set_header X-Verified-Project-Memberships $auth_verified_project_memberships;
        proxy_set_header X-Verified-Memberships-HMAC $auth_verified_memberships_hmac;
        proxy_set_header Authorization $http_authorization;

        # Allow large uploads for RAG documents
        client_max_body_size 10g;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
    }

    # =================================================================
    # MCP Routes - /gw/mcp/* → UMRS (direct, CRUD + tool invocation
    #   all handled inside UMRS)
    # =================================================================
    location /gw/mcp/ {
        limit_req zone=general_limit burst=30 nodelay;

        # Auth validation
        auth_request /auth/validate;
        auth_request_set $auth_error $upstream_http_x_auth_error;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_project_id $upstream_http_x_project_id;
        auth_request_set $auth_verified_project_id $upstream_http_x_verified_project_id;
        auth_request_set $auth_verified_is_admin $upstream_http_x_verified_is_admin;
        auth_request_set $auth_verified_hmac $upstream_http_x_verified_hmac;
        auth_request_set $auth_verified_project_memberships $upstream_http_x_verified_project_memberships;
        auth_request_set $auth_verified_memberships_hmac $upstream_http_x_verified_memberships_hmac;

        # Rewrite /gw/mcp/* → /umrs/mcp/* for UMRS MCP router
        rewrite ^/gw/mcp/(.*)$ /umrs/mcp/$1 break;

        proxy_pass http://umrs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-Project-ID $auth_project_id;
        proxy_set_header X-Verified-Project-ID $auth_verified_project_id;
        proxy_set_header X-Verified-Is-Admin $auth_verified_is_admin;
        proxy_set_header X-Verified-HMAC $auth_verified_hmac;
        proxy_set_header X-Verified-Project-Memberships $auth_verified_project_memberships;
        proxy_set_header X-Verified-Memberships-HMAC $auth_verified_memberships_hmac;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 300s;
    }

    # =================================================================
    # Skill Registry Routes - /gw/skills/* → UMRS (direct proxy)
    # =================================================================
    location /gw/skills/ {
        limit_req zone=general_limit burst=30 nodelay;

        # S7 internal lane marker — no v-lane publication; sunset TBD at S12
        add_header X-API-Lane "internal" always;
        add_header Deprecation "true" always;

        auth_request /auth/validate;

        auth_request_set $auth_error $upstream_http_x_auth_error;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_project_id $upstream_http_x_project_id;
        auth_request_set $auth_verified_project_id $upstream_http_x_verified_project_id;
        auth_request_set $auth_verified_is_admin $upstream_http_x_verified_is_admin;
        auth_request_set $auth_verified_hmac $upstream_http_x_verified_hmac;
        auth_request_set $auth_verified_project_memberships $upstream_http_x_verified_project_memberships;
        auth_request_set $auth_verified_memberships_hmac $upstream_http_x_verified_memberships_hmac;

        rewrite ^/gw/skills/(.*)$ /umrs/skills/$1 break;

        proxy_pass http://umrs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-Project-ID $auth_project_id;
        proxy_set_header X-Verified-Project-ID $auth_verified_project_id;
        proxy_set_header X-Verified-Is-Admin $auth_verified_is_admin;
        proxy_set_header X-Verified-HMAC $auth_verified_hmac;
        proxy_set_header X-Verified-Project-Memberships $auth_verified_project_memberships;
        proxy_set_header X-Verified-Memberships-HMAC $auth_verified_memberships_hmac;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
    }

    location = /gw/skills {
        limit_req zone=general_limit burst=30 nodelay;

        # S7 internal lane marker — no v-lane publication; sunset TBD at S12
        add_header X-API-Lane "internal" always;
        add_header Deprecation "true" always;

        auth_request /auth/validate;

        auth_request_set $auth_error $upstream_http_x_auth_error;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_project_id $upstream_http_x_project_id;
        auth_request_set $auth_verified_project_id $upstream_http_x_verified_project_id;
        auth_request_set $auth_verified_is_admin $upstream_http_x_verified_is_admin;
        auth_request_set $auth_verified_hmac $upstream_http_x_verified_hmac;
        auth_request_set $auth_verified_project_memberships $upstream_http_x_verified_project_memberships;
        auth_request_set $auth_verified_memberships_hmac $upstream_http_x_verified_memberships_hmac;

        rewrite ^ /umrs/skills break;

        proxy_pass http://umrs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-Project-ID $auth_project_id;
        proxy_set_header X-Verified-Project-ID $auth_verified_project_id;
        proxy_set_header X-Verified-Is-Admin $auth_verified_is_admin;
        proxy_set_header X-Verified-HMAC $auth_verified_hmac;
        proxy_set_header X-Verified-Project-Memberships $auth_verified_project_memberships;
        proxy_set_header X-Verified-Memberships-HMAC $auth_verified_memberships_hmac;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
    }

    # =================================================================
    # Endpoint CRUD Routes - /gw/endpoints/* → UMRS (direct proxy)
    # =================================================================
    location /gw/endpoints/ {
        limit_req zone=general_limit burst=30 nodelay;

        auth_request /auth/validate;

        auth_request_set $auth_error $upstream_http_x_auth_error;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_project_id $upstream_http_x_project_id;
        auth_request_set $auth_verified_project_id $upstream_http_x_verified_project_id;
        auth_request_set $auth_verified_is_admin $upstream_http_x_verified_is_admin;
        auth_request_set $auth_verified_hmac $upstream_http_x_verified_hmac;
        auth_request_set $auth_verified_project_memberships $upstream_http_x_verified_project_memberships;
        auth_request_set $auth_verified_memberships_hmac $upstream_http_x_verified_memberships_hmac;

