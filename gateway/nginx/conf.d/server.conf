        rewrite ^ /umrs/knowledge break;

        proxy_pass http://umrs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-Project-ID $auth_project_id;
        proxy_set_header X-Verified-Project-ID $auth_verified_project_id;
        proxy_set_header X-Verified-Is-Admin $auth_verified_is_admin;
        proxy_set_header X-Verified-HMAC $auth_verified_hmac;
        proxy_set_header X-Verified-Project-Memberships $auth_verified_project_memberships;
        proxy_set_header X-Verified-Memberships-HMAC $auth_verified_memberships_hmac;
        proxy_set_header Authorization $http_authorization;

        proxy_read_timeout 30s;
    }

    # Server-scoped route fragments provisioned by deployment roles.
    include /etc/nginx/app.d/*.conf;

    # =================================================================
    # Error Pages
    # =================================================================
    error_page 429 = @error429;
    location @error429 {
        default_type application/json;
        add_header Retry-After 1 always;
        return 429 '{"error": "Too Many Requests", "message": "Rate limit exceeded"}';
    }

    # ADR-097: an auth refusal (403) names its reason, e.g. project_not_member
    # when the requested project is not one of the caller's live memberships.
    error_page 403 = @error403;
    location @error403 {
        default_type application/json;
        return 403 '{"error": "Forbidden", "code": "$auth_error", "message": "Access denied"}';
    }

    # 500 is nginx's own answer when the auth check fails without deciding
    # (e.g. membership_unavailable: the sidecar could not reach UMRS).
    error_page 500 502 503 504 = @error5xx;
    location @error5xx {
        default_type application/json;
        return 503 '{"error": "Service Unavailable", "code": "$auth_error", "message": "Backend service temporarily unavailable"}';
    }
}
