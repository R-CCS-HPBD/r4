        proxy_read_timeout 5s;
    }

    # Connect-info endpoint — optional auth.  Basic ZMQ discovery info is
    # always returned.  When a valid JWT is present, the sidecar sets the
    # signed identity tuple so UMRS can include the user's s3cfg in the
    # response: strict UMRS emits it only for a tuple whose X-Verified-HMAC
    # verifies, so the whole tuple is forwarded, not X-User-ID alone
    # (H-1, 2026-10-18).  Without a token the variables are empty and nginx
    # drops the headers (a client-sent copy never reaches UMRS).
    location = /gw/ops/connect-info {
        limit_req zone=general_limit burst=10 nodelay;

        # S7 internal lane marker — no v-lane publication; sunset TBD at S12
        add_header X-API-Lane "internal" always;
        add_header Deprecation "true" always;

        auth_request /auth/validate-optional;

        auth_request_set $auth_error $upstream_http_x_auth_error;
        auth_request_set $auth_user_id $upstream_http_x_user_id;
        auth_request_set $auth_verified_project_id $upstream_http_x_verified_project_id;
        auth_request_set $auth_verified_is_admin $upstream_http_x_verified_is_admin;
        auth_request_set $auth_verified_hmac $upstream_http_x_verified_hmac;

        rewrite ^ /umrs/ops/connect-info break;

        proxy_pass http://umrs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-User-ID $auth_user_id;
        proxy_set_header X-Verified-Project-ID $auth_verified_project_id;
        proxy_set_header X-Verified-Is-Admin $auth_verified_is_admin;
        proxy_set_header X-Verified-HMAC $auth_verified_hmac;
        proxy_connect_timeout 5s;
        proxy_read_timeout 5s;
