# Gateway Secrets
# IMPORTANT: Replace placeholder values before deploying!
# Consider using sealed-secrets, external-secrets, or vault for production.
apiVersion: v1
kind: Secret
metadata:
  name: rivault-gateway-secrets
  namespace: rivault-system
  labels:
    app.kubernetes.io/name: rivault-gateway
    app.kubernetes.io/component: gateway
    app.kubernetes.io/part-of: ai-platform
type: Opaque
stringData:
  # JWT signing secret - CHANGE THIS IN PRODUCTION
  # Generate with: openssl rand -base64 32
  JWT_SECRET: "CHANGE-ME-generate-with-openssl-rand-base64-32"

  # Service key for Gateway -> LiteLLM authentication
  # This should match the key configured in LiteLLM
  GATEWAY_LITELLM_SERVICE_KEY: "sk-gateway-service-key-change-me"

  # (Optional) Audit log database connection
  # AUDIT_LOG_DB: "postgresql://user:pass@host:5432/audit"
