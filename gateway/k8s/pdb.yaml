# Gateway PodDisruptionBudget
# Ensures high availability during voluntary disruptions
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: rivault-gateway
  namespace: rivault-system
  labels:
    app.kubernetes.io/name: rivault-gateway
    app.kubernetes.io/component: gateway
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: rivault-gateway
