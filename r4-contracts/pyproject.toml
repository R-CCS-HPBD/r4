[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "r4-contracts"
version = "0.2.0rc4"
description = "Shared schemas, DTOs, and validators between r4 (client SDK) and UMRS (platform)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "RCCS AI Platform Team" },
]
keywords = ["r4", "umrs", "contracts", "schemas"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
# stdlib + umrs-protocol (itself stdlib-only), ADR-005 as amended by ADR-117.
# The 16 moved modules are aliases of umrs_protocol (U2.0b). The floor moves in
# lockstep with the release (scripts/release/cut.sh).
dependencies = ["umrs-protocol>=0.2.0rc4"]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/r4_contracts"]
