# Grafana Dashboard Provisioning
# Auto-loads dashboards from the dashboards folder

apiVersion: 1

providers:
  - name: 'RiVault Dashboards'
    orgId: 1
    folder: 'RiVault'
    folderUid: rivault
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
