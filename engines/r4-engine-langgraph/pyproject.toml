[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "r4-engine-langgraph"
version = "0.1.0"
description = "LangGraph adapter for the R4 Team Engine SPI (ADR-020). Compiles TeamSpec into a LangGraph StateGraph; all model/tool calls route through RuntimeServices brokers."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "RCCS AI Platform Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "r4-contracts>=0.1.0",
    "r4-teamengine-spi>=0.1.0",
    "langgraph>=1.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.4",
]

[project.entry-points."r4.team_engines"]
langgraph = "r4_engine_langgraph:LangGraphEngine"

[tool.hatch.build.targets.wheel]
packages = ["src/r4_engine_langgraph"]
