{{- /* vllm-api-key: vllm.apiKey when set; otherwise the key already in this
     Secret (kept across upgrades); otherwise a fresh random key. Never a
     fixed string shared by every install. */ -}}
{{- $secretName := printf "%s-secrets" (include "rivault.fullname" .) }}
{{- $vllmKey := .Values.vllm.apiKey | default "" }}
{{- if not $vllmKey }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $secretName).data | default dict }}
{{- $vllmKey = get $existing "vllm-api-key" | default "" | b64dec }}
{{- end }}
{{- $vllmKey = $vllmKey | default (randAlphaNum 32) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "rivault.labels" . | nindent 4 }}
type: Opaque
stringData:
  litellm-master-key: {{ .Values.litellm.masterKey | quote }}
  vllm-api-key: {{ $vllmKey | quote }}
