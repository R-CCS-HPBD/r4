apiVersion: v1
kind: Service
metadata:
  name: {{ include "rivault.fullname" . }}
  labels:
    {{- include "rivault.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: litellm
      port: {{ .Values.service.port }}
      targetPort: litellm
      protocol: TCP
  selector:
    {{- include "rivault.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: inference
