  path: /gw/uploads/manifests/canary-nonexistent
  expect_denied: true
- id: user-buckets
  path: /gw/buckets
  expect_denied: true
- id: user-buckets-cross-scope
  # ADR-079: personal buckets are owner-scoped; a non-member project must not read
  # another user's namespace (H-1 leftover: the user-bucket canary target).
  path: /gw/buckets?project_id=${CANARY_PROJECT_B}
  expect_denied: true
  authenticated: true
  forbidden_projects: ${CANARY_PROJECT_B}
- id: ops-governance-admin
  # H-1 leftover: the real ops-admin target — a NON-admin verified caller
  # hitting an admin-only governance route must be refused (403).
  path: /gw/ops/governance/analytics
  expect_denied: true
  authenticated: true
- id: scientific-catalogs
  # H-12 audit finding (2026-10-20): the family row's edge-denied probe.
  path: /gw/scientific-catalogs
  expect_denied: true
- id: custom-mcp-invoke
  # Custom MCP invocation (ADR-037 Rule 2a family): anonymous invoke is denied
  # at the edge; the identity-derived grant itself stays spec-only (matrix row).
  path: /gw/mcp/invoke
  expect_denied: true
