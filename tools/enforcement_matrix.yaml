    ux_gate: none
    verified_by: workflow-runs
    notes: "upload/trigger/definitions; author claim verified via verify_workflow_author_claim (handshake hmac suite). The trigger routes admit a declared project only from the signed project or the gateway-signed memberships list (X-Verified-Memberships-HMAC, get_verified_memberships; strict mode, H-1 2026-10-18)"
    review: "2026-10-18"

  # ── Ops admin ─────────────────────────────────────────────────────────────
  - id: ops-admin
    path_prefix: /umrs/ops
    methods: [GET, POST, PUT, PATCH, DELETE]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: ops-admin
    ux_gate: none
    verified_by: ops-admin
    notes: "require_ops_admin (HMAC-verified admin, H-1 2026-10-17) guards health/topology; quota/retention/orphan/transfer writes need x-admin-token = UMRS_ADMIN_TOKEN; shares need the signed owner or the admin token; reload and governance reads take the HMAC-verified caller (own project unless admin). GET /timeline is admin-only (require_ops_admin; its decorator is on ops_timeline again); connect-info discovery stays open, and under UMRS_EMIT_S3CFG=1 emits the s3cfg only for a signed tuple in strict (forged tuple 401; H-1 2026-10-18); the gateway /gw/ops/connect-info block forwards the signed tuple (X-User-ID, X-Verified-Project-ID, X-Verified-Is-Admin, X-Verified-HMAC) from validate-optional since 2026-10-18 (live after the next gateway converge)"
    review: "2026-10-18"

  # ── Remaining mutating families (sprint-1 sweep baseline) ────────────────
  # Authz values below are audit assertions to re-verify during each cycle;
  # each row gets a dedicated deep pass before the matrix graduates hard-fail.

  - id: models-registry
    path_prefix: /umrs/models
    methods: [GET, POST, PUT, PATCH, DELETE]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: owner-scope
    ux_gate: none
    verified_by: models-registry
    notes: "model registry + policies; scope model is system/project/user per development.instructions. The ACL context is the HMAC-verified user/admin plus the signed project and the gateway-signed memberships list (X-Verified-Memberships-HMAC; unsigned list ignored in strict); project-scope create/stage/publish/download need a writable member project (_member_may_write); ?caller_project_id is checked with writable_project_for, default the caller's project (Appendix A.1; H-1 2026-10-18)"
    review: "2026-10-18"

  - id: jobs
    path_prefix: /umrs/jobs
    methods: [GET, POST, PATCH, DELETE]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: owner-scope
    ux_gate: none
    verified_by: jobs
    notes: "durable job control (cancel/retry); commit-pointer and execution authority are server-only. H-1 (2026-10-18): a non-admin endpoint_provision spec (parent or fan-out child) follows POST /umrs/endpoints/provision: its model (spec.model, else 'default', the name the executor resolves) must resolve to a catalog entry the caller may provision (400 unresolved, 403 foreign scope); env_vars, container_image and tier=system are admin-only (403); its mount sources and host model_path must lie under its own roots (403). The partition stays with the executor's site check. Project and user come from the signed tuple (IDENTITY-ONLY in the scope guard)"
    review: "2026-10-18"

