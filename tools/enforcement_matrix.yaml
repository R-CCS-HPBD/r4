# Enforcement-point matrix (ADR-035, proposed)
#
# One row per UMRS HTTP surface family. The matrix is the specification the
# console `/health authz` audit probes against. Invariant:
#   any route where mutating=true MUST carry a non-blank enforceable umrs_authz
#   (gateway_auth or ux_gate alone is not sufficient for platform state).
#
# Field semantics:
#   path_prefix  longest-prefix match against the live FastAPI surface
#   methods      methods this row claims responsibility for
#   mutating     does any method change platform state
#   gateway_auth edge authn: auth_request (NGINX auth_request) | open | exclude
#   umrs_authz   authz inside UMRS handler:
#                  owner-scope      caller identity must own/match the scope
#                  verified-identity requires trusted X-Verified-* headers
#                  provision-identity-derived
#                                  authz computed at provisioning from the verified
#                                  identity + tenant tier (ADR-037 Rule 2a)
#                  mutation-guard   knowledge mutation guard decides (ADR-015/027)
#                  ops-admin        admin-only dependency: require_ops_admin, or
#                                   require_session_admin (/umrs/admin, 2026-10-27)
#                  read-only        no writes, authz not applicable
#                  internal         loopback/worker-only, never edge-exposed
#                  exempt           documented exemption (notes must say why)
#   ux_gate      client-side gating only (never an enforcement point):
#                  permission-manager | approval-card | none
#   review       date this row was last audited against the handler code
#
# Rows are data, not code analysis: the validator reports drift against the
# live surface, but `umrs_authz` values are assertions to be re-verified per
# row during each audit cycle (`review` field).

version: 1

defaults:
  gateway_auth: auth_request
  ux_gate: none

rows:
  # ── Health/metrics/readiness (open by whitelist) ─────────────────────────
  - id: health-readiness-metrics
    path_prefix: /health
    methods: [GET]
    mutating: false
    gateway_auth: open
    umrs_authz: read-only
    ux_gate: none
    verification_exempt: "open beacon surface — anon-allowed by design; there is nothing for a deny-canary to deny (the row's own notes, 2026-10-18)"
    notes: "whitelist prefix; also covers /readiness, /metrics, the /umrs/web static shell and /umrs/web/dashboard/{health,metrics} — structural beacon surface; no canary (anon-allowed by design, nothing to deny). The rest of /umrs/web/dashboard needs HMAC-verified identity since H-1 (2026-10-17) and falls to platform-default. H-1 2026-10-18: the static shell calls the API under /gw/web/dashboard when served at /gw/web/ (nginx /gw/web/ block with auth_request); overview and job-list counts come from JobStore.count_jobs under the caller's scope; the route inventory whitelists only the static mount and the two probes"
    review: "2026-10-18"

  # ── A2L conservation ledger (ADR-034 merge domain) ────────────────────────
  - id: a2l-ledger
    path_prefix: /umrs/a2l
    methods: [GET, POST, PATCH]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: verified-identity
    ux_gate: none
    verified_by: a2l-ledger
    notes: "agent-exec/decisions/artifacts + derive/resolve transitions; PoC-grade surface pending ADR-034 consolidation. H-1 (2026-10-17): /a2l/artifacts, /resolve, /derive and ledger decisions take the HMAC-verified caller and check the project of every artifact they touch"
    review: "2026-10-18"

  # ── Companion venue worker + turns (ADR-025/-028, T3a) ─────────────────────
  - id: companion-workers
    path_prefix: /umrs/companion/workers
    methods: [GET, POST]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: verified-identity
    ux_gate: permission-manager
    verified_by: companion-workers
    notes: "worker registry; resume-token fingerprint compare on reattach (fingerprint_matches); a named owner must equal the HMAC-verified caller (_strict_headers) and the durable job lands in a project the caller may write (H-1 2026-10-17); an empty owner defaults to the caller and a body job_id must be the caller's own companion job in that project, else 404 (H-1 2026-10-18)"
    review: "2026-10-18"

  - id: companion-chat-turns
    path_prefix: /umrs/companion
    methods: [GET, POST]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: verified-identity
    ux_gate: permission-manager
    verified_by: companion-workers
    notes: "/chat attempts + /turns/{attempt_id} replay; approvals decision endpoint is the durable approval channel (ADR-028 §2). H-1 (2026-10-17): turns read only by the worker owner, ownerless approvals follow the loop rule, session/venue owner from the HMAC-verified tuple. DEFERRED H-1: a non-owner of an owned approval gets 401, not 404, which discloses that it exists"
    review: "2026-10-18"

  # ── Endpoints lifecycle ───────────────────────────────────────────────────
  - id: endpoints-upgrade
    path_prefix: /umrs/endpoints
    methods: [GET, POST, PUT, PATCH, DELETE]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: owner-scope
    ux_gate: none
    verified_by: endpoints-upgrade
    notes: "provision/deprovision/upgrade; per-user Slurm account resolution runs inside the owner gate; ADR-040 D4 refuse-before-launch — any `egress_domains` provision must carry `network.egress_proxy_image` (or `EGRESS_GUARD_IMAGE`) at the site else 400 (rccs declares localhost/r4-mcp:latest from 2026-09-07). non-admin mount sources and caller-named model paths (model_path override, absolute model with no catalog entry) must lie under the caller's own roots (UMRS_ENDPOINT_CALLER_MOUNT_ROOTS, default /home/{user_id},/shared/users/{user_id},/shared/projects/{project_id},/projects/{project_id}) else 403 (H-1 2026-10-18). Since 2026-10-18 (h1-leftovers) the same rule (orchestrator/caller_roots.py) covers POST /{job_id}/upgrade model_path (site-wide prefixes, then caller roots unless it is the storage_ref of a catalog entry the caller may provision) and POST /umrs/jobs endpoint_provision spec.mounts / spec.model_path / spec.model, plus the recipe policy (env_vars, container_image, tier=system admin-only) and a model that must resolve (parent and fan-out children); upgrade, PUT /{job_id}/access, DELETE /{job_id}/deprovision and PUT /{job_id}/used check the strict identity (401) before the lookup (404). DEFERRED H-1: the check is lexical at request time (launcher re-check pending); the ZMQ job submit (job_tracking_handler) does not apply the caller-root rule to endpoint_provision specs yet"
    review: "2026-10-18"

  # ── Files (upload/download) ───────────────────────────────────────────────
  - id: files
    path_prefix: /umrs/files
    methods: [GET, POST, DELETE]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: verified-identity
    ux_gate: none
    verified_by: files
    notes: "presigned URLs never leave the server side; download/{path} is read but classified mutating=false per method table below. GET /download-status and the presign download gate resolve the caller (get_project_id) and read another project's job as 404 files.job_not_found (H-1 A.2, 2026-10-18)"
    review: "2026-10-18"

  # ── Knowledge multi-graph + proposals (ADR-015/027/031) ───────────────────
  - id: knowledge-ledger
    path_prefix: /umrs/knowledge/graphs
