    gateway_auth: auth_request
    umrs_authz: mutation-guard
    ux_gate: approval-card
    verified_by: knowledge-proposals
    notes: proposal decision endpoint; autopilot never auto-approves (development.instructions invariants). Id-shaped canary covers the family's auth chain (pure-denied GET on a false id)
    review: "2026-09-02"

  - id: knowledge-read
    path_prefix: /umrs/knowledge
    methods: [GET]
    mutating: false
    gateway_auth: auth_request
    umrs_authz: read-only
    ux_gate: none
    verified_by: knowledge-read
    notes: graph/reconcile/query reads; mutating subpaths covered by the two rows above (longest-prefix wins)
    review: "2026-09-02"

  # ── Research loops (server venue) ─────────────────────────────────────────
  - id: research-loops
    path_prefix: /umrs/loops
    methods: [GET, POST, PUT, PATCH, DELETE]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: owner-scope
    ux_gate: permission-manager
    verified_by: research-loops
    notes: "loop start/stop/pause/resume; autopilot must refuse loop start until TRUST allowlist rows exist (Review F3). 2026-10-18: a thread-hosted runner never overwrites a concurrent pause or stop: on the psycopg2 LoopStore it saves through LoopStore.save_keeping_control (SELECT ... FOR UPDATE and the upsert in one transaction under the store lock, so a resume is neither lost nor undone). Residual: other stores (HttpLoopStore on cluster drivers) re-read then save, so a resume stored between the two calls is written back to PAUSED until resumed again; PUT /{loop_id}/state and the pause/stop/resume routes still read-modify-write with plain save()"
    review: "2026-10-18"

  # ── Research sessions (ADR-025) ───────────────────────────────────────────
  - id: research-sessions
    path_prefix: /umrs/research/sessions
