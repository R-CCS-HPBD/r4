      runner refuses to start in any non-local profile when the var is absent
      or unsigned (STANDARD_USER survives only in compose/dev). ADR-037
      shadow mode (would_filter telemetry, nothing removed) applies
      meanwhile. Canary scope (2026-10-20): the edge-denied probe covers
      gateway authn only; the Rule-2a injection claim stays
      specification-only until the provision path lands — an authenticated
