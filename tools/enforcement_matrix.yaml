    methods: [GET, POST]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: owner-scope
    ux_gate: none
    verified_by: asset-grants
    notes: "mint/revoke require _asset_writable (asset must be the caller's to share); unwritable assets answer 404-shaped — existence never leaks; revoke = tombstone, never DELETE. grants._caller takes the HMAC-verified tuple (forged tuple 401 in strict); revoke needs the grantor, an asset writer or a verified admin, anyone else reads not found (H-1 2026-10-18)"
    review: "2026-10-18"

  # ── Quota gauge (ADR-051 read model; /units) ─────────────────────────────
  - id: quota-status
    path_prefix: /umrs/quota
    methods: [GET]
    mutating: false
    gateway_auth: auth_request
    umrs_authz: verified-identity
    ux_gate: none
    verified_by: quota-status
    notes: caller-attributed gauge of the two resource poles; anonymous refused in both mvp and strict (shared scope layer); read-only
    review: "2026-09-16"

  # ── Researcher buckets (ADR-079 / ADR-080) ──────────────────────────────
  - id: user-buckets
    path_prefix: /umrs/buckets
    methods: [GET, POST, PUT]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: owner-scope
    ux_gate: none
    verified_by: user-buckets
    notes: "<user>.<project>.<alias> buckets owned by the HMAC-verified caller (get_verified_caller); the project segment is a free experiment label (ADR-079 D-2), so access changes audit under the caller's verified project with the label in the details (H-1 2026-10-18); a name owned by another user is bucket_taken; access lists are owner or admin. PUT /{bucket}/access answers a caller the access list does not admit files.not_found, like an unknown bucket and like GET (no oracle on guessable names); an admitted reader gets 403 bucket_denied (H-1 2026-10-18). Canary: the anonymous /gw/buckets deny (edge authn; the owner-scope claim is the row text)"
    review: "2026-10-20"

  # ── Circles + membership (ADR-086; supersedes the ADR-050 §3 groups) ────
  - id: circles-authority
    path_prefix: /umrs/circles
    methods: [GET, POST, PATCH, DELETE]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: owner-scope
    ux_gate: none
    verified_by: circles-authority
    notes: "project-scoped owner-attributed circles; retire is owner-or-admin tombstone; roster ops owner/circle-admin/platform-admin; personal circles (circle_id == owner) never gain members; retired circles stop resolving for access lookups immediately. H-1 (2026-10-17): GET circle and members need identity and read as 404 to unaffiliated callers; H-1 (2026-10-18): GET /{project_id} reads as 404 unless the caller is admin, project owner, affiliated, has its own circle there or is verified into the project. DEFERRED H-1 (escalated, ADR-086 §3): POST personal-cell self-entry in any project is an existence oracle and self-affiliates"
    review: "2026-10-18"

  # ── Projects registry (ADR-051) ──────────────────────────────────────────
  - id: projects-registry
    path_prefix: /umrs/projects
    methods: [GET, POST, PATCH]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: verified-identity
    ux_gate: none
    verified_by: projects-registry
    notes: "ADR-051 casual-projects registry; edge family /gw/projects/ added 2026-09-16 (live at next gateway converge); create is caller-attributed, retire is admin-gated, tombstones never DELETE. H-1 (2026-10-17): GET project and budget read as 404 except to owner, admin, signed project or affiliated caller. H-1 (2026-10-18): POST with a taken id returns the row only to a caller who may read it, else 409 projects.conflict; PUT budget reads as 404 to non-readers. DEFERRED H-1: PATCH and the /storage routes still answer 403, not 404, to non-readers"
    review: "2026-10-18"

  # ── Work-level scope tokens (ADR-108 D-3, W2b) ──────────────────────────
  - id: scope-tokens
    path_prefix: /umrs/scopes
    methods: [POST]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: owner-scope
    ux_gate: none
    notes: "ADR-108 D-3 (2026-11-04). POST issues a token on the caller's verified identity (get_caller_identity); a child token must sit beneath its parent's path with a subset of its grants and no later expiry, else 403 scopes.forbidden. POST /revoke revokes a path prefix for the caller's own user and project only. A token never adds a right: routes that read x-r4-scope (ingest, upload, workflow trigger) refuse one bound to another user or project. No canary probe yet (specification only)"
    review: "2026-11-04"

  # ── Catch-all row: any surface not listed above ───────────────────────────
  # ── Scientific catalogs (bundle registry) ────────────────────────────
  - id: scientific-catalogs
    path_prefix: /umrs/scientific-catalogs
    methods: [GET, POST, PATCH, PUT, DELETE]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: owner-scope
    ux_gate: none
    verified_by: scientific-catalogs
    notes: "catalog create/patch/retire + pins + access (H-12 live-catch-all row, 2026-10-20). Every handler takes the verified caller (get_caller_identity); writes then require the caller's project to match the row's (_require_project_scope, admin bypass); reads admit the owning project, admin, or the row's ADR-080 access list (_catalog_read_allowed)"
    review: "2026-10-20"

  # ── Admin session control + session policy (RS-0 / ADR-099) ──────────
  - id: admin-sessions
    path_prefix: /umrs/admin/sessions
    methods: [GET, POST]
    mutating: true
    gateway_auth: exclude
    umrs_authz: ops-admin
    ux_gate: none
    verification_exempt: "not edge-exposed: no gateway location serves /umrs/admin (/gw/ops/ rewrites to /umrs/ops/ only; the operator CLI calls UMRS directly), so a /gw deny-canary would only witness the edge 404; the server-side 401/403 is pinned by umrs/tests/test_rs0_admin_sessions.py::TestAdminAuth (2026-10-27)"
    notes: "list/show/stop any user's venue session (H-12 live-catch-all row, issue #594, 2026-10-27). Every route takes require_session_admin (admin JWT, or the gateway-signed X-Verified-* admin tuple + HMAC; strict and mvp alike): no credential 401, non-admin or disabled account 403 audited as venue.admin.denied. POST /{session_id}/stop runs the owner stop path (FrontendVenueService.admin_stop -> stop) and writes venue.session.stop with cause=admin; show/list write venue.admin.show/list"
    review: "2026-10-27"

  - id: admin-session-policy
    path_prefix: /umrs/admin/session-policy
    methods: [GET, PUT, DELETE]
    mutating: true
    gateway_auth: exclude
    umrs_authz: ops-admin
    ux_gate: none
    verification_exempt: "not edge-exposed: no gateway location serves /umrs/admin (/gw/ops/ rewrites to /umrs/ops/ only), so a /gw deny-canary would only witness the edge 404; the server-side 401/403 on every verb is pinned by umrs/tests/test_session_policy_routes.py::TestAdminAccess (2026-10-27)"
    notes: "ADR-099 admin rule layer (H-12 live-catch-all row, issue #594, 2026-10-27). Every route takes require_session_admin: no credential 401, non-admin 403. PUT /{scope}/{subject} writes the admin rule and audits venue.policy.set; DELETE removes one rule and audits venue.policy.delete; an unknown rule is sessionpolicy.not_found. The project owner's layer is PUT /umrs/projects/{id}/session-policy (projects-registry row)"
    review: "2026-10-27"

  - id: platform-default
    path_prefix: /umrs
    methods: [GET, POST, PUT, PATCH, DELETE]
    mutating: true
    gateway_auth: auth_request
    umrs_authz: verified-identity
    ux_gate: none
    verification_exempt: "no single probe can stand for the catch-all; the row-verified-missing advisory here was ADR-035's intended permanent reminder, now carried by this field (2026-10-20)"
    notes: catch-all fallback; a mutating route matching ONLY this row flags the family for a dedicated audit row (validator reports it separately). The row-verified-missing advisory on this row is the intended permanent reminder, per ADR-035
    review: "2026-09-02"
