# n8n Kubernetes Service
#
# Deploy: kubectl apply -f service.yaml

apiVersion: v1
kind: Service
metadata:
  name: n8n
  namespace: rivault
  labels:
    app: n8n
    component: workflow
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 5678
      targetPort: http
      protocol: TCP
  selector:
    app: n8n

